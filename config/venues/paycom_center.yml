# Paycom Center's lower bowl at the Thunder bench end: sections 119, 120,
# 101 and 102, drawn by the seat map on the Pricing page (Venue::Layout).
#
# Facing this end from the court, left to right: 119, 120, 101, 102.
# - 120 and 101 are the two halves behind the basket: straight rows parallel
#   to the baseline, split by a center aisle on the basket line.
# - 119 and 102 are corner wedges with diagonal rows; team tunnels run along
#   their outer sides (118/119 and 102/103).
#
# Seat numbers run left to right as seen from the court (seat 1 is on the
# right for someone sitting there). In 101, seat 1 is on the center aisle, so
# our DD 1-3 sit right behind the basket; in 120, seat 1 is at the 119 end.
#
# Each row: its seats, and "offset", the empty seat widths at the end next to
# the center (the aisle, or the basket support in the floor rows). A row that
# isn't listed doesn't exist in that section. Row SA, 120's accessible row,
# stands where S would be.
#
# Sources: 101 and 120 from Ticketmaster's seat map (Duggan's screenshots,
# 2026-11-17, every seat counted); the order, shapes and rows from
# RateYourSeats and the Gametime map. 119 and 102 are estimates from the
# map's outline: nobody publishes their row lengths.
name: Paycom Center
sections:
  "119":
    shape: corner
    side: left
    source: estimated
    rows: &corner
      AA: 3
      BB: 5
      CC: 6
