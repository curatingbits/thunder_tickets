<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#16161e">
    <title>Offline · MADR Tickets</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
             background: #16161e; color: #c0caf5; font-family: system-ui, -apple-system, sans-serif; text-align: center; }
      .brand { font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem; }
      .brand .a { color: #7aa2f7; } .brand .b { color: #ff9e64; }
      h1 { color: #fff; font-size: 1.5rem; margin: 0 0 .5rem; }
      p { color: #a9b1d6; margin: 0 0 1.5rem; max-width: 22rem; }
      a { display: inline-block; background: #7aa2f7; color: #16161e; padding: .75rem 1.25rem;
          border-radius: .5rem; font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="a">MADR</span> <span class="b">TICKETS</span></div>
      <h1>You're offline</h1>
      <p>MADR Tickets needs a connection to show current sales, prices and payouts.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
